<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scrollstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Inline Custom Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230b1329' stroke='%2338bdf8' stroke-width='4'/><path d='M40 28 L72 50 L40 72 Z' fill='%2338bdf8'/><path d='M42 54 A10 10 0 1 0 52 64 L52 36 L66 36' fill='none' stroke='%230b1329' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scrollstage">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Scrollstage%22,%22short_name%22:%22Scrollstage%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23060a17%22,%22theme_color%22:%22%230b1329%22}">

<style>
:root{--bg:#eef2f8;--panel:#f8fafc;--ink:#0f172a;--mute:#64748b;--line:#cbd5e1;--a1:#0284c7;--a2:#38bdf8;--on:#0f172a;--focus:#0284c7;--stage:#e2e8f0;--glow:rgba(56,189,248,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060a17;--panel:#0b1329;--ink:#f1f5f9;--mute:#94a3b8;--line:#1e293b;--a1:#0284c7;--a2:#38bdf8;--on:#060a17;--focus:#38bdf8;--stage:#020612;--glow:rgba(56,189,248,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060a17;--panel:#0b1329;--ink:#f1f5f9;--mute:#94a3b8;--line:#1e293b;--a1:#0284c7;--a2:#38bdf8;--on:#060a17;--focus:#38bdf8;--stage:#020612;--glow:rgba(56,189,248,.45);color-scheme:dark}
:root[data-theme="gig"]{--bg:#000000;--panel:#0a0a0a;--ink:#ffffff;--mute:#a1a1aa;--line:#27272a;--a1:#38bdf8;--a2:#38bdf8;--on:#000000;--focus:#38bdf8;--stage:#000000;--glow:rgba(56,189,248,.75);color-scheme:dark}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden} body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,.vs:focus-visible,.song:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg{display:block}
#app{display:flex;height:100%;position:relative}

/* library */
#lib{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;margin-left:-290px;transition:margin-left .25s ease,transform .25s ease;z-index:30}
body.lib-open #lib{margin-left:0}
#lib .brand-header{display:flex;align-items:center;gap:10px;padding:18px 18px 4px}
#lib .brand-header svg{width:28px;height:28px;color:var(--a2)}
#lib h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
#lib .sub{padding:0 18px 10px;color:var(--mute);font-size:13px}

/* Folder Selector Bar */
#folder-bar{padding:0 14px 10px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)}
#folder-select{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:13px}
.folder-btn{width:32px;height:32px;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);display:grid;place-items:center;font-size:18px;font-weight:700}
.folder-btn:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}

#list{flex:1;overflow:auto;padding:8px 10px 4px}
.song{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;margin-bottom:4px;border:1px solid transparent}
.song:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.song.on{background:color-mix(in srgb,var(--a2) 20%,transparent);border-color:color-mix(in srgb,var(--a2) 70%,transparent)}
.song .t{flex:1;min-width:0}
.song .n{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .m{font-size:12px;color:var(--mute);margin-top:2px}
.song .arr-btn,.song .x{width:28px;height:28px;border-radius:6px;color:var(--mute);display:grid;place-items:center;font-size:14px;line-height:1}
.song .arr-btn:hover,.song .x:hover{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}

#libfoot{padding:12px;border-top:1px solid var(--line)}
#note{font-size:12px;color:var(--mute);margin:8px 4px 0}
.add{width:100%;padding:13px;border-radius:12px;font-weight:700;color:var(--on);background:var(--a2)}
.btn-sec{width:100%;padding:10px;border-radius:10px;font-weight:600;font-size:13px;margin-top:6px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink);border:1px solid var(--line);text-align:center}
.btn-sec:hover{background:color-mix(in srgb,var(--ink) 14%,transparent)}
.sync-row{display:flex;gap:6px;margin-top:6px}
.sync-row .btn-sec{margin-top:0;flex:1}
#empty-list{padding:18px 8px;color:var(--mute);font-size:14px;line-height:1.5}
#scrim{display:none}

.set{padding:0 4px 8px}.lbl{font-size:12px;color:var(--mute);margin-bottom:6px}.seg{display:flex;background:color-mix(in srgb,var(--ink) 8%,transparent);border-radius:10px;padding:3px}.seg button{flex:1;padding:8px;border-radius:8px;font-weight:500;color:var(--mute)}.seg button.on{background:var(--a2);color:var(--on)}.bps{display:none;align-items:center;justify-content:space-between;margin-top:10px;font-size:14px}.bps div{display:flex;align-items:center;gap:6px}.bps button{width:34px;height:34px;border-radius:9px;font-size:20px;background:color-mix(in srgb,var(--ink) 8%,transparent)}.bps b{min-width:30px;text-align:center}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-size:13px;color:var(--ink)}
.toggle-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--a2);cursor:pointer}

/* Notes Panel */
#np{position:absolute;top:0;right:0;bottom:0;width:min(340px,85%);background:var(--panel);border-left:1px solid var(--line);z-index:10;display:none;flex-direction:column;padding:12px}
#np.open{display:flex}
#np .nh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700}
#np .nh span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .nh button{width:34px;height:34px;border-radius:9px;font-size:22px;color:var(--mute)}
#nt{flex:1;resize:none;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.5;padding:12px}
#nt:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* stage */
#stage{flex:1;min-width:0;position:relative;background:var(--stage)}
#scroller{position:absolute;inset:0;overflow:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#scroller::-webkit-scrollbar{display:none}
#pages{margin:0 auto}
.page{position:relative;background:#fff;margin:0 0 3px;overflow:hidden;transition:filter 0.2s ease}
.page canvas{display:block}

/* Invert PDF pages in Gig Mode */
:root[data-theme="gig"] .page{background:#000;filter:invert(1) hue-rotate(180deg)}

#welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
#welcome h2{font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:-.03em;margin:0 0 10px}
#welcome p{margin:0 auto 22px;color:var(--mute);max-width:34ch;line-height:1.5}
#welcome .add{width:auto;padding:14px 28px}
#welcome.drag{outline:3px dashed var(--a2);outline-offset:-14px}
#msg{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;display:none;z-index:5}

/* Countdown Overlay */
#cd-overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,0.65);z-index:40;backdrop-filter:blur(4px)}
#cd-overlay.active{display:grid}
#cd-num{font-size:120px;font-weight:700;color:var(--a2);text-shadow:0 0 30px var(--glow);animation:popIn 0.8s ease infinite}
@keyframes popIn{0%{transform:scale(0.5);opacity:0}50%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

/* rail */
#rail{width:68px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;z-index:20;transition:width .2s ease}
#rail .tool{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--ink);font-size:24px;font-weight:500}
#rail .tool:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
#rail .tool.on{background:color-mix(in srgb,var(--a2) 28%,transparent)}
#play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--on);background:var(--a2);box-shadow:0 0 0 0 var(--glow),0 6px 20px var(--glow);margin:4px 0;transition:transform 0.15s ease}
#play:hover{transform:scale(1.05)}
#play.on{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow),0 6px 20px var(--glow)}70%{box-shadow:0 0 0 14px transparent,0 6px 20px var(--glow)}100%{box-shadow:0 0 0 0 transparent,0 6px 20px var(--glow)}}
@media (prefers-reduced-motion:reduce){#play.on{animation:none}#lib,#rail{transition:none}}
.vs{flex:1;min-height:90px;width:46px;position:relative;touch-action:none;cursor:ns-resize;border-radius:14px}
.vs .tr{position:absolute;left:50%;top:10px;bottom:10px;width:8px;margin-left:-4px;border-radius:8px;background:var(--line);overflow:hidden}
.vs .fl{position:absolute;left:0;right:0;bottom:0;background:var(--a2)}
.vs .th{position:absolute;left:50%;width:30px;height:30px;margin:0 0 -15px -15px;border-radius:50%;background:var(--ink);border:4px solid var(--a2);box-shadow:0 2px 10px var(--glow)}
#spd{font-weight:700;font-size:18px;line-height:1}
#spdl{font-size:11px;color:var(--mute)}
#unit{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;padding:4px 0;border-radius:10px}#unit:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
#rail.min{width:28px;padding-top:10px}
#rail.min>:not(#fold){display:none}
#rail.min #fold svg{transform:rotate(180deg)}

@media (max-width:899px){
  #lib{position:absolute;left:0;top:0;bottom:0;margin-left:0;transform:translateX(-100%);box-shadow:6px 0 30px rgba(0,0,0,.35)}
  body.lib-open #lib{transform:none;margin-left:0}
  body.lib-open #scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:25}
}
</style>
</head>
<body class="lib-open">
<div id="app">
  <aside id="lib" aria-label="Song library">
    <div class="brand-header">
      <svg viewBox="0 0 100 100" fill="currentColor">
        <path d="M35 25 L75 50 L35 75 Z"/>
        <path d="M38 56 A10 10 0 1 0 48 66 L48 32 L66 32" fill="none" stroke="var(--panel)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Scrollstage</h1>
    </div>
    <div class="sub">Songs you add are saved on this device.</div>

    <!-- Show Folders Bar -->
    <div id="folder-bar">
      <select id="folder-select" aria-label="Select Show Folder"></select>
      <button class="folder-btn" id="add-folder-btn" title="Create New Folder">+</button>
      <button class="folder-btn" id="del-folder-btn" title="Delete Folder">−</button>
    </div>

    <div id="list"></div>
    <div id="libfoot">
      <div class="set">
        <div class="lbl">Speed unit</div>
        <div class="seg" id="seg"><button data-u="lvl">Level</button><button data-u="bpm">BPM</button></div>
        <div class="bps" id="bpsrow" title="How many beats pass before the page moves one screen height"><span>Beats per screen</span><div><button id="bm" aria-label="Fewer beats per screen">−</button><b id="bpsv">32</b><button id="bp" aria-label="More beats per screen">+</button></div></div>
      </div>
      <div class="toggle-row">
        <span>3s Lead-In Countdown</span>
        <input type="checkbox" id="cdToggle">
      </div>
      <button class="add" id="addBtn">Add PDFs</button>
      <div class="sync-row">
        <button class="btn-sec" id="exportBtn">Export Setlist</button>
        <button class="btn-sec" id="importBtn">Import Setlist</button>
      </div>
      <div id="note"></div>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="stage">
    <div id="scroller"><div id="pages"></div></div>
    <div id="welcome">
      <div>
        <h2>Hands free, eyes up.</h2>
        <p>Open a PDF, set the speed, and it scrolls itself while you play.</p>
        <button class="add" id="addBtn2">Open a PDF</button>
      </div>
    </div>
    <div id="msg"></div>
    <div id="cd-overlay"><div id="cd-num">3</div></div>

    <!-- Notes Panel -->
    <div id="np">
      <div class="nh"><span id="nname">Notes</span><button id="nclose" aria-label="Close notes">×</button></div>
      <textarea id="nt" aria-label="Song notes"></textarea>
    </div>
  </main>

  <nav id="rail" aria-label="Controls">
    <button class="tool" id="menu" aria-label="Toggle song list"></button>
    <button id="play" aria-label="Play or pause"></button>
    <div class="vs" id="vs" role="slider" tabindex="0" aria-label="Scroll speed" aria-valuemin="1" aria-valuemax="100"><div class="tr"><div class="fl" id="fl"></div></div><div class="th" id="th"></div></div>
    <button id="unit" aria-label="Switch between level and BPM"><span id="spd">20</span><span id="spdl">level</span></button>
    <button class="tool" id="zin" aria-label="Zoom in">+</button>
    <button class="tool" id="zout" aria-label="Zoom out">−</button>
    <button class="tool" id="top" aria-label="Back to top"></button>
    <button class="tool" id="notes" aria-label="Notes"></button>
    <button class="tool" id="gigMode" aria-label="Toggle Gig Mode"></button>
    <button class="tool" id="fold" aria-label="Hide controls"></button>
  </nav>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="importFile" accept=".sstg,.scrollstage,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function(){
const $=s=>document.querySelector(s);
const IC={
 play:'<svg width="30" height="30" viewBox="0 0 100 100" fill="currentColor"><path d="M35 22 L78 50 L35 78 Z"/><path d="M38 56 A10 10 0 1 0 48 66 L48 30 L68 30" fill="none" stroke="var(--a2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 pause:'<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg>',
 menu:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
 top:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h12M12 19V9M7 13l5-5 5 5"/></svg>',
 fold:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 gig:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7zM9 21h6"/></svg>'
};
$('#menu').innerHTML=IC.menu;$('#top').innerHTML=IC.top;$('#fold').innerHTML=IC.fold;$('#notes').innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3"/></svg>';$('#play').innerHTML=IC.play;$('#gigMode').innerHTML=IC.gig;

pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- storage ---------- */
const mem=[];let persistent=true,dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('scrollstage',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function run(mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('songs',mode);const q=fn(t.objectStore('songs'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const store={
 async all(){try{return await run('readonly',s=>s.getAll())||[]}catch(e){persistent=false;return mem.slice()}},
 async put(o){if(persistent){try{await run('readwrite',s=>s.put(o));return}catch(e){persistent=false}}const i=mem.findIndex(x=>x.id===o.id);if(i<0)mem.push(o);else mem[i]=o},
 async del(id){if(persistent){try{await run('readwrite',s=>s.delete(id))}catch(e){}}const i=mem.findIndex(x=>x.id===id);if(i>=0)mem.splice(i,1)}
};
let defSpeed=20,defZoom=1,mode='lvl',bpm=70,bps=32,useCountdown=false,isGigTheme=false;
let folders=['All Songs'], activeFolder='All Songs';

try{
  defSpeed=+localStorage.getItem('ss_speed')||20;
  mode=localStorage.getItem('ss_mode')==='bpm'?'bpm':'lvl';
  bpm=+localStorage.getItem('ss_bpm')||70;
  bps=+localStorage.getItem('ss_bps')||32;
  useCountdown=localStorage.getItem('ss_cd')==='true';
  isGigTheme=localStorage.getItem('ss_theme')==='gig';
  folders=JSON.parse(localStorage.getItem('ss_folders'))||['All Songs'];
  activeFolder=localStorage.getItem('ss_active_folder')||'All Songs';
}catch(e){}

$('#cdToggle').checked=useCountdown;
$('#cdToggle').onchange=e=>{useCountdown=e.target.checked;try{localStorage.setItem('ss_cd',useCountdown)}catch(ex){}};

if(isGigTheme){document.documentElement.setAttribute('data-theme','gig');$('#gigMode').classList.add('on')}

$('#gigMode').onclick=()=>{
  isGigTheme=!isGigTheme;
  if(isGigTheme){document.documentElement.setAttribute('data-theme','gig');$('#gigMode').classList.add('on');localStorage.setItem('ss_theme','gig');}
  else{document.documentElement.removeAttribute('data-theme');$('#gigMode').classList.remove('on');localStorage.setItem('ss_theme','std');}
};

/* ---------- folders handling ---------- */
function updateFolderSelect(){
  const sel=$('#folder-select');
  sel.innerHTML='';
  folders.forEach(f=>{
    const opt=document.createElement('option');
    opt.value=f; opt.textContent=f;
    if(f===activeFolder) opt.selected=true;
    sel.appendChild(opt);
  });
}

$('#folder-select').onchange=e=>{
  activeFolder=e.target.value;
  try{localStorage.setItem('ss_active_folder',activeFolder)}catch(ex){}
  renderList();
};

$('#add-folder-btn').onclick=()=>{
  const name=prompt('Enter new folder/setlist name:');
  if(!name||!name.trim())return;
  const clean=name.trim();
  if(!folders.includes(clean)){
    folders.push(clean);
    activeFolder=clean;
    try{
      localStorage.setItem('ss_folders',JSON.stringify(folders));
      localStorage.setItem('ss_active_folder',activeFolder);
    }catch(e){}
    updateFolderSelect();
    renderList();
  }
};

$('#del-folder-btn').onclick=async ()=>{
  if(activeFolder==='All Songs'){toast('Cannot delete the main folder.');return;}
  if(!confirm(`Delete folder "${activeFolder}"? Songs will stay in All Songs.`))return;
  folders=folders.filter(f=>f!==activeFolder);
  activeFolder='All Songs';
  try{
    localStorage.setItem('ss_folders',JSON.stringify(folders));
    localStorage.setItem('ss_active_folder',activeFolder);
  }catch(e){}
  updateFolderSelect();
  renderList();
};

/* ---------- state ---------- */
let songs=[],cur=null,pdf=null,playing=false,speed=defSpeed,zoom=1,token=0,cdTimer=null;
const scroller=$('#scroller'),pagesEl=$('#pages');
const spd=()=>mode==='bpm'?bpm/60*scroller.clientHeight/bps:4*Math.pow(1.04,speed);

/* ---------- Export & Import (.sstg) ---------- */
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function dataURItoBlob(dataURI) {
  const byteString = atob(dataURI.split(',')[1]);
  const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < byteString.length; i++) {
    ia[i] = byteString.charCodeAt(i);
  }
  return new Blob([ab], {type: mimeString});
}

$('#exportBtn').onclick = async () => {
  if (!songs.length) { toast('No songs to export.'); return; }
  toast('Preparing setlist file…');
  try {
    const exportData = [];
    for (const s of songs) {
      let b64 = null;
      if (s.blob) {
        b64 = await blobToBase64(s.blob);
      }
      exportData.push({
        id: s.id,
        name: s.name,
        folder: s.folder || 'All Songs',
        speed: s.speed,
        bpm: s.bpm,
        zoom: s.zoom,
        pos: s.pos,
        notes: s.notes,
        added: s.added,
        blobData: b64
      });
    }
    const blob = new Blob([JSON.stringify(exportData)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Setlist_' + new Date().toISOString().slice(0,10) + '.sstg';
    a.click();
    toast('Setlist exported successfully!');
  } catch (e) {
    toast('Failed to export setlist.');
  }
};

$('#importBtn').onclick = () => $('#importFile').click();

$('#importFile').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  toast('Importing setlist…');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (Array.isArray(data)) {
      for (const item of data) {
        if(item.folder && !folders.includes(item.folder)) folders.push(item.folder);
        const s = {
          id: item.id || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)),
          name: item.name,
          folder: item.folder || 'All Songs',
          speed: item.speed || defSpeed,
          bpm: item.bpm || bpm,
          zoom: item.zoom || 1,
          pos: item.pos || 0,
          notes: item.notes || '',
          added: item.added || Date.now(),
          blob: item.blobData ? dataURItoBlob(item.blobData) : null
        };
        await store.put(s);
        const idx = songs.findIndex(x => x.id === s.id);
        if (idx >= 0) songs[idx] = s;
        else songs.push(s);
      }
      localStorage.setItem('ss_folders',JSON.stringify(folders));
      updateFolderSelect();
      renderList();
      toast('Setlist imported successfully!');
    }
  } catch (err) {
    toast('Invalid .sstg file.');
  }
  e.target.value = '';
};

/* ---------- library & reordering ---------- */
function moveSong(visIdx, dir) {
  const visibleSongs = getVisibleSongs();
  if (visIdx + dir < 0 || visIdx + dir >= visibleSongs.length) return;
  
  const s1 = visibleSongs[visIdx];
  const s2 = visibleSongs[visIdx + dir];
  
  const t = s1.added;
  s1.added = s2.added;
  s2.added = t;
  
  store.put(s1); store.put(s2);
  songs.sort((a,b)=>(a.added||0)-(b.added||0));
  renderList();
}

function getVisibleSongs(){
  return activeFolder === 'All Songs' ? songs : songs.filter(s => s.folder === activeFolder);
}

function renderList(){
 const l=$('#list');l.innerHTML='';
 const visibleSongs = getVisibleSongs();
 
 if(!visibleSongs.length){l.innerHTML='<div id="empty-list">No songs in this folder yet. Add a PDF to populate it.</div>'}
 visibleSongs.forEach((s, idx)=>{
  const b=document.createElement('div');b.className='song'+(cur&&cur.id===s.id?' on':'');b.tabIndex=0;b.setAttribute('role','button');
  b.innerHTML='<button class="arr-btn up" aria-label="Move up">▲</button><button class="arr-btn dn" aria-label="Move down">▼</button><div class="t"><div class="n"></div><div class="m"></div></div><button class="x" aria-label="Remove song">×</button>';
  b.querySelector('.n').textContent=s.name;
  b.querySelector('.m').textContent=(s.pages?s.pages+(s.pages>1?' pages':' page'):'PDF')+(mode==='bpm'&&s.bpm?' · '+s.bpm+' BPM':' · speed '+(s.speed||defSpeed));
  b.onclick=()=>openSong(s);
  b.onkeydown=e=>{if(e.key==='Enter')openSong(s)};
  b.querySelector('.up').onclick=e=>{e.stopPropagation();moveSong(idx, -1);};
  b.querySelector('.dn').onclick=e=>{e.stopPropagation();moveSong(idx, 1);};
  b.querySelector('.x').onclick=async e=>{e.stopPropagation();if(!confirm('Remove “'+s.name+'” from your setlist?'))return;await store.del(s.id);songs=songs.filter(z=>z.id!==s.id);if(cur&&cur.id===s.id){closeSong()}renderList()};
  l.appendChild(b);
 });
 $('#note').textContent=persistent?'':'Saving is unavailable here, so songs last until you close this tab.';
}
function narrow(){return innerWidth<900}
function setLib(o){document.body.classList.toggle('lib-open',o);schedResize()}
$('#menu').onclick=()=>setLib(!document.body.classList.contains('lib-open'));
$('#scrim').onclick=()=>setLib(false);

async function addFiles(files){
 let last=null;
 for(const f of files){
  if(!(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)))continue;
  const s={id:(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),name:f.name.replace(/\.pdf$/i,''),folder:activeFolder,blob:f,speed:speed,zoom:1,pos:0,added:Date.now()};
  await store.put(s);songs.push(s);last=s;
 }
 if(!last){toast('Choose a PDF file.');return}
 renderList();openSong(last);
}
$('#addBtn').onclick=$('#addBtn2').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();$('#welcome').classList.add('drag')});
addEventListener('dragleave',()=>$('#welcome').classList.remove('drag'));
addEventListener('drop',e=>{e.preventDefault();$('#welcome').classList.remove('drag');addFiles([...(e.dataTransfer.files||[])])});

let tmsg;function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(tmsg);tmsg=setTimeout(()=>m.style.display='none',3200)}

/* ---------- viewer ---------- */
async function openSong(s){
 setPlaying(false);saveNow();
 const my=++token;cur=s;renderList();loadNotes();
 try{
  if(!s.blob&&s.assetId){toast('Downloading song…');const r=await fetch('/_blob/'+s.assetId);if(!r.ok)throw 0;s.blob=await r.blob();store.put(s)}
  const buf=await s.blob.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  if(my!==token)return;
  pdf=doc;
  speed=s.speed||defSpeed;bpm=s.bpm||bpm;zoom=s.zoom||1;setSpeed(mode==='bpm'?bpm:speed,true);
  if(!s.pages){s.pages=doc.numPages;store.put(s)}
  $('#welcome').style.display='none';
  await build(s.pos||0,my);
  renderList();
  if(narrow())setLib(false);
 }catch(e){toast('That PDF could not be opened.')}
}
function closeSong(){token++;cur=null;pdf=null;pagesEl.innerHTML='';$('#welcome').style.display='grid';setPlaying(false);loadNotes()}

let obs=null,pw=0;
async function build(restore,my){
 if(obs)obs.disconnect();pagesEl.innerHTML='';
 const p1=await pdf.getPage(1),v1=p1.getViewport({scale:1});
 if(my!==token)return;
 pw=Math.round(scroller.clientWidth*zoom);const ratio=v1.height/v1.width;
 pagesEl.style.width=pw+'px';
 for(let i=1;i<=pdf.numPages;i++){const d=document.createElement('div');d.className='page';d.dataset.n=i;d.style.height=Math.round(pw*ratio)+'px';pagesEl.appendChild(d)}
 obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)renderPage(e.target,my)}),{root:scroller,rootMargin:'150% 0px'});
 [...pagesEl.children].forEach(c=>obs.observe(c));
 scroller.scrollTop=typeof restore==='number'?restore:0;pos=scroller.scrollTop;expect=pos;
}
async function renderPage(el,my){
 if(el._d)return;el._d=1;
 try{
  const pg=await pdf.getPage(+el.dataset.n);if(my!==token)return;
  const b=pg.getViewport({scale:1}),css=pw/b.width;
  let sc=css*Math.min(devicePixelRatio||1,2);const px=b.width*b.height*sc*sc;if(px>14e6)sc*=Math.sqrt(14e6/px);
  const vp=pg.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  c.style.width=pw+'px';c.style.height=Math.round(b.height*css)+'px';
  el.style.height=c.style.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  if(my===token)el.appendChild(c);
 }catch(e){el._d=0}
}

/* ---------- autoscroll & countdown ---------- */
let last=0,pos=0,expect=0,hold=false,holdT,raf=0,lock=null;
function tick(t){
 if(!playing)return;
 const dt=Math.min(.05,(t-last)/1000);last=t;
 if(!hold){
  if(Math.abs(scroller.scrollTop-expect)>2)pos=scroller.scrollTop;
  pos+=spd()*dt;
  const max=scroller.scrollHeight-scroller.clientHeight;
  if(pos>=max){scroller.scrollTop=max;setPlaying(false);return}
  scroller.scrollTop=pos;expect=scroller.scrollTop;
 }
 raf=requestAnimationFrame(tick);
}

function startCountdown(cb) {
  let count = 3;
  const cdOverlay = $('#cd-overlay');
  const cdNum = $('#cd-num');
  cdNum.textContent = count;
  cdOverlay.classList.add('active');
  
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    count--;
    if (count > 0) {
      cdNum.textContent = count;
    } else {
      clearInterval(cdTimer);
      cdOverlay.classList.remove('active');
      cb();
    }
  }, 1000);
}

async function setPlaying(p){
 if(p&&!pdf){toast('Open a PDF first.');return}
 clearInterval(cdTimer);
 $('#cd-overlay').classList.remove('active');

 if(p && useCountdown && !playing) {
   startCountdown(()=>startPlayingEngine());
   return;
 }
 
 if(p) startPlayingEngine();
 else stopPlayingEngine();
}

async function startPlayingEngine() {
 playing=true;$('#play').innerHTML=IC.pause;$('#play').classList.add('on');
 cancelAnimationFrame(raf);
 pos=scroller.scrollTop;expect=pos;last=performance.now();raf=requestAnimationFrame(tick);
 try{if(navigator.wakeLock)lock=await navigator.wakeLock.request('screen')}catch(e){}
}

function stopPlayingEngine() {
 playing=false;$('#play').innerHTML=IC.play;$('#play').classList.remove('on');
 cancelAnimationFrame(raf);
 try{if(lock){lock.release();lock=null}}catch(e){}
 saveNow();
}

$('#play').onclick=()=>setPlaying(!playing);
document.addEventListener('visibilitychange',()=>{if(playing&&!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>lock=l)}catch(e){}}});

const holdOn=()=>{hold=true;clearTimeout(holdT)};
const holdOff=()=>{clearTimeout(holdT);holdT=setTimeout(()=>{hold=false;pos=scroller.scrollTop;expect=pos},700)};
scroller.addEventListener('pointerdown',holdOn);
scroller.addEventListener('pointerup',holdOff);scroller.addEventListener('pointercancel',holdOff);
scroller.addEventListener('wheel',()=>{holdOn();holdOff()},{passive:true});
let sv;scroller.addEventListener('scroll',()=>{clearTimeout(sv);sv=setTimeout(saveNow,600)},{passive:true});

/* ---------- speed slider ---------- */
const vs=$('#vs');
function setSpeed(v,quiet){
 if(mode==='bpm')bpm=Math.max(40,Math.min(200,Math.round(v)));else speed=Math.max(1,Math.min(100,Math.round(v)));
 const val=mode==='bpm'?bpm:speed,lo=mode==='bpm'?40:1,hi=mode==='bpm'?200:100;
 $('#spd').textContent=val;$('#spdl').textContent=mode==='bpm'?'BPM':'level';
 vs.setAttribute('aria-valuenow',val);vs.setAttribute('aria-valuemin',lo);vs.setAttribute('aria-valuemax',hi);
 const f=(val-lo)/(hi-lo);$('#fl').style.height=(f*100)+'%';
 const h=vs.clientHeight-20;$('#th').style.top=(10+(1-f)*h)+'px';
 if(!quiet){
   try{localStorage.setItem('ss_speed',speed);localStorage.setItem('ss_bpm',bpm)}catch(e){}
   if(cur){cur.speed=speed;cur.bpm=bpm;schedSave()}
 }
}
function nudge(d){setSpeed((mode==='bpm'?bpm:speed)+d)}
function setMode(m){
 if(m===mode)return;
 const p=spd(),H=scroller.clientHeight||800;
 mode=m;
 if(m==='bpm')bpm=Math.max(40,Math.min(200,Math.round(p*60*bps/H)));
 else speed=Math.max(1,Math.min(100,Math.round(Math.log(p/4)/Math.log(1.04))));
 try{localStorage.setItem('ss_mode',m)}catch(e){}
 syncUnits();setSpeed(m==='bpm'?bpm:speed,true);renderList();
}
function setBps(n){bps=Math.max(8,Math.min(128,n));try{localStorage.setItem('ss_bps',bps)}catch(e){}$('#bpsv').textContent=bps;}
function syncUnits(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.u===mode));$('#bpsrow').style.display=mode==='bpm'?'flex':'none';$('#bpsv').textContent=bps}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.u));
$('#unit').onclick=()=>setMode(mode==='bpm'?'lvl':'bpm');
$('#bm').onclick=()=>setBps(bps-4);$('#bp').onclick=()=>setBps(bps+4);
function fromY(y){const r=vs.getBoundingClientRect();const f=1-(y-r.top-10)/(r.height-20);const lo=mode==='bpm'?40:1,hi=mode==='bpm'?200:100;return lo+Math.max(0,Math.min(1,f))*(hi-lo)}
vs.addEventListener('pointerdown',e=>{vs.setPointerCapture(e.pointerId);setSpeed(fromY(e.clientY))});
vs.addEventListener('pointermove',e=>{if(vs.hasPointerCapture(e.pointerId))setSpeed(fromY(e.clientY))});
vs.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowRight'){nudge(1);e.preventDefault()}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){nudge(-1);e.preventDefault()}});

/* ---------- zoom, top, fold ---------- */
function setZoom(z){
 if(!pdf)return;zoom=Math.max(.6,Math.min(2.4,Math.round(z*10)/10));
 const r=scroller.scrollHeight?scroller.scrollTop/scroller.scrollHeight:0;
 const my=++token;cur&&(cur.zoom=zoom);
 build(0,my).then(()=>{scroller.scrollTop=r*scroller.scrollHeight;pos=scroller.scrollTop;expect=pos;schedSave()});
}
$('#zin').onclick=()=>setZoom(zoom+.2);$('#zout').onclick=()=>setZoom(zoom-.2);
$('#top').onclick=()=>{scroller.scrollTop=0;pos=0;expect=0};
$('#fold').onclick=()=>{const m=$('#rail').classList.toggle('min');$('#fold').setAttribute('aria-label',m?'Show controls':'Hide controls');schedResize()};

/* ---------- save + resize ---------- */
let st;function schedSave(){clearTimeout(st);st=setTimeout(saveNow,500)}
function saveNow(){if(!cur)return;cur.pos=scroller.scrollTop;cur.speed=speed;cur.bpm=bpm;cur.zoom=zoom;store.put(cur)}
let rt,lw=0;
function schedResize(){clearTimeout(rt);rt=setTimeout(()=>{if(!pdf)return;const w=scroller.clientWidth;if(Math.abs(w-lw)<3)return;lw=w;const r=scroller.scrollTop/(scroller.scrollHeight||1);const my=++token;build(0,my).then(()=>{scroller.scrollTop=r*scroller.scrollHeight;pos=scroller.scrollTop;expect=pos})},250)}
new ResizeObserver(()=>{setSpeed(mode==='bpm'?bpm:speed,true);schedResize()}).observe($('#stage'));
addEventListener('pagehide',saveNow);

/* ---------- notes ---------- */
const nt=$('#nt'),np=$('#np');
function loadNotes(){nt.value=cur&&cur.notes||'';nt.disabled=!cur;nt.placeholder=cur?'Capo, key, cues, tempo changes…':'Open a song to add notes.';$('#nname').textContent=cur?cur.name:'Notes'}

function setNotes(o){np.classList.toggle('open',o);$('#notes').classList.toggle('on',o);if(o)loadNotes()}
$('#notes').onclick=()=>setNotes(!np.classList.contains('open'));
$('#nclose').onclick=()=>setNotes(false);

nt.addEventListener('input',()=>{if(!cur)return;cur.notes=nt.value.slice(0,5000);schedSave()});

/* ---------- keys & Bluetooth Foot Pedal controls ---------- */
addEventListener('keydown',e=>{
 if(e.target.closest&&e.target.closest('input,textarea,.vs'))return;
 if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}
 else if(e.key==='PageDown'||(e.key==='ArrowRight'&&!e.shiftKey)){
   e.preventDefault();
   scroller.scrollTop += scroller.clientHeight * 0.85;
   pos = scroller.scrollTop; expect = pos;
 }
 else if(e.key==='PageUp'||(e.key==='ArrowLeft'&&!e.shiftKey)){
   e.preventDefault();
   scroller.scrollTop -= scroller.clientHeight * 0.85;
   pos = scroller.scrollTop; expect = pos;
 }
 else if(e.key==='ArrowUp'&&e.shiftKey){nudge(5)}
 else if(e.key==='ArrowDown'&&e.shiftKey){nudge(-5)}
 else if(e.key==='Home'){$('#top').click()}
});

/* ---------- boot ---------- */
(async()=>{
 syncUnits();setSpeed(mode==='bpm'?bpm:speed,true);
 updateFolderSelect();
 songs=await store.all();
 songs.sort((a,b)=>(a.added||0)-(b.added||0));
 renderList();
 if(narrow()&&songs.length)setLib(false);
 lw=scroller.clientWidth;
})();
})();
</script>
</body>
</html>
